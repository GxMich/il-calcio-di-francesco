<style>
/* Layout: pitch-striped header, scoreboard tabs (top bar on desktop, iOS-style tab bar on phones), one view at a time. */
:root {
  --erba: #1d7a3c;
  --erba-2: #19703a;
  --gesso: #ffffff;
  --bg: #f2f6f1;
  --card: #ffffff;
  --fg: #11261a;
  --muted: #586c60;
  --linea: #d5e2d7;
  --tabellone: #13201a;
  --barra: rgba(19, 32, 26, .9);
  --barra-testo: #a9bbb0;
  --led: #ffcf1a;
  --giallo: #ffcf1a;
  --rosso: #d4383b;
  --vinta: #1e9b52;
  --pari: #8c9a92;
  --persa: #d4383b;
  --cuore-bg: #fff6cc;
  --cuore-bordo: #e6b400;
  --link: #126c35;
  --f-display: "Bungee", "Arial Black", system-ui, sans-serif;
  --f-testo: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-numeri: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --tab-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1711; --card: #12241a; --fg: #e6f1e9; --muted: #9bb2a3; --linea: #23402f;
    --tabellone: #050b08; --barra: rgba(5, 11, 8, .88); --cuore-bg: #3a3210; --cuore-bordo: #e6b400; --link: #7fd9a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1711; --card: #12241a; --fg: #e6f1e9; --muted: #9bb2a3; --linea: #23402f;
  --tabellone: #050b08; --barra: rgba(5, 11, 8, .88); --cuore-bg: #3a3210; --cuore-bordo: #e6b400; --link: #7fd9a0;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-testo); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--link); }
a, button, select, label { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--giallo); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
img { max-width: 100%; }

/* ---------- Campo (header) ---------- */
.campo {
  background:
    radial-gradient(circle at 50% 120%, transparent 0 88px, rgba(255,255,255,.5) 89px 92px, transparent 93px),
    linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(255,255,255,.5) calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
    repeating-linear-gradient(90deg, var(--erba) 0 64px, var(--erba-2) 64px 128px);
  color: var(--gesso);
  border-bottom: 4px solid var(--gesso);
}
.campo .wrap { padding-block: 28px 22px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between; }
.logo { display: flex; gap: 14px; align-items: center; min-width: 0; }
.logo svg { width: 56px; height: 56px; flex: none; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.5rem, 5vw, 2.8rem); line-height: 1.05; margin: 0; text-shadow: 0 3px 0 rgba(0,0,0,.25); text-wrap: balance; }
.sotto { margin: 6px 0 0; font-weight: 600; opacity: .95; }
.cuore { display: flex; flex-direction: column; gap: 4px; font-weight: 800; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
.cuore select { font: 600 1rem var(--f-testo); padding: 10px 12px; min-height: 44px; border-radius: 12px; border: 2px solid var(--gesso); background: rgba(0,0,0,.25); color: var(--gesso); min-width: 200px; }
.cuore select option { color: #11261a; background: #fff; }

/* ---------- Tabellone (tabs) ---------- */
.tabs { background: var(--tabellone); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--erba); }
.tabs .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
.tabs a { flex: none; display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: .9rem; color: #c9d6cd; text-decoration: none; padding: 10px 14px; border-radius: 10px; letter-spacing: .02em; }
.tabs a svg { display: none; }
.tabs a .corto { display: none; }
.tabs a[aria-current="page"] { background: var(--led); color: #13201a; }
@media (hover: hover) { .tabs a:not([aria-current]):hover { color: var(--led); } }

main .wrap { padding-block: 28px 48px; display: flex; flex-direction: column; gap: 32px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.3rem, 3.5vw, 1.9rem); margin: 0; line-height: 1.1; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.1rem; margin: 0; }
.etichetta { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.intesta { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.intesta p { margin: 0; color: var(--muted); }
section { display: flex; flex-direction: column; gap: 16px; }

/* ---------- Partite ---------- */
.griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.partita { background: var(--card); border: 2px solid var(--linea); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.partita.mia { border-color: var(--cuore-bordo); background: var(--cuore-bg); }
.riga { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.sq { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-weight: 800; font-size: .95rem; line-height: 1.15; min-width: 0; overflow-wrap: anywhere; }
.sq img { width: 44px; height: 44px; object-fit: contain; }
.sq.perde { color: var(--muted); font-weight: 600; }
.punteggio { background: var(--tabellone); color: var(--led); font-family: var(--f-display); font-size: 1.7rem; padding: 6px 12px; border-radius: 10px; letter-spacing: .05em; font-variant-numeric: tabular-nums; min-width: 92px; text-align: center; box-shadow: inset 0 0 0 2px rgba(255,207,26,.18); }
.punteggio.ora { font-family: var(--f-numeri); font-size: 1.4rem; color: #e8f2ea; }
.info { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; font-size: .85rem; color: var(--muted); }
.info a { font-weight: 800; text-decoration: none; padding: 8px 0; }
@media (hover: hover) { .info a:hover { text-decoration: underline; } }

.fatti { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.fatti.tre { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fatto { background: var(--card); border: 2px solid var(--linea); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fatto b { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fatto span { color: var(--muted); font-size: .9rem; }

/* La tua squadra */
.tua { background: var(--cuore-bg); border: 2px solid var(--cuore-bordo); border-radius: 18px; padding: 16px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
.tua > img { width: 64px; height: 64px; object-fit: contain; }
.tua .nome { font-family: var(--f-display); font-size: 1.5rem; line-height: 1; }
.tua dl { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0; }
.tua dt { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tua dd { margin: 0; font-weight: 800; font-size: 1.05rem; }

/* Forma V N P */
.forma { display: inline-flex; gap: 3px; }
.forma i { font-style: normal; width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; font: 700 .8rem var(--f-numeri); color: #fff; }
.forma .V { background: var(--vinta); } .forma .N { background: var(--pari); } .forma .P { background: var(--persa); }

/* ---------- Ultime 100 ---------- */
.filtri { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.filtri label { display: flex; flex-direction: column; gap: 4px; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.filtri select { font: 600 1rem var(--f-testo); padding: 10px 12px; min-height: 44px; border-radius: 12px; border: 2px solid var(--linea); background: var(--card); color: var(--fg); min-width: 220px; }
.barra-esiti { display: flex; height: 34px; border-radius: 10px; overflow: hidden; font: 700 .95rem var(--f-numeri); color: #fff; }
.barra-esiti div { display: flex; align-items: center; justify-content: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .9rem; color: var(--muted); margin-top: 6px; }
.legenda span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.grafico { background: var(--card); border: 2px solid var(--linea); border-radius: 16px; padding: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.barre { display: flex; align-items: end; gap: 6px; height: 170px; min-width: 340px; border-bottom: 2px solid var(--linea); margin-top: 12px; }
.barre .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: end; gap: 3px; height: 100%; }
.barre .b div { width: 100%; max-width: 46px; background: var(--erba); border-radius: 6px 6px 0 0; }
.barre .b span { font: 700 .9rem var(--f-numeri); font-variant-numeric: tabular-nums; }
.assex { display: flex; gap: 6px; min-width: 340px; margin-top: 4px; }
.assex span { flex: 1; text-align: center; font: 600 .8rem var(--f-numeri); color: var(--muted); }

.elenco { display: flex; flex-direction: column; gap: 18px; }
.gruppo { display: flex; flex-direction: column; gap: 6px; }
.compatta { background: var(--card); border: 2px solid var(--linea); border-radius: 12px; padding: 6px 6px 6px 12px; display: grid; grid-template-columns: 64px 1fr auto 1fr 40px; gap: 8px; align-items: center; font-size: .95rem; min-height: 52px; }
.compatta.mia { border-color: var(--cuore-bordo); background: var(--cuore-bg); }
.compatta .d { font: 600 .85rem var(--f-numeri); color: var(--muted); }
.compatta .c { display: flex; align-items: center; gap: 6px; justify-content: end; text-align: right; font-weight: 700; min-width: 0; }
.compatta .o { display: flex; align-items: center; gap: 6px; font-weight: 700; min-width: 0; }
.compatta img { width: 24px; height: 24px; object-fit: contain; flex: none; }
.compatta .s { background: var(--tabellone); color: var(--led); font: 400 1rem var(--f-display); padding: 3px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; min-width: 58px; text-align: center; }
.compatta .v { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; text-decoration: none; font-weight: 800; color: var(--link); }
@media (hover: hover) { .compatta .v:hover { background: var(--linea); } }
.compatta .perde { color: var(--muted); font-weight: 600; }
.nome-lungo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.compatta.fut { grid-template-columns: 1fr 92px 1fr; padding-right: 12px; }
.compatta.fut .s { font: 600 .95rem/1.15 var(--f-numeri); color: #e8f2ea; padding: 4px 6px; display: flex; flex-direction: column; }
.compatta.fut .s b { font-weight: 700; color: var(--led); text-transform: capitalize; }

/* Calendario */
.conto { background: var(--cuore-bg); border: 2px solid var(--cuore-bordo); border-radius: 18px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.conto > img { width: 48px; height: 48px; object-fit: contain; }
.conto .grande { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; }
.conto p { margin: 0; }
details.giornata { display: flex; flex-direction: column; }
details.giornata summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; min-height: 48px; background: var(--card); border: 2px solid var(--linea); border-radius: 12px; font-weight: 800; }
details.giornata summary::-webkit-details-marker { display: none; }
details.giornata summary::after { content: ""; width: 10px; height: 10px; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(45deg); transition: transform .2s; flex: none; margin-top: -4px; }
details.giornata[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
details.giornata summary span { color: var(--muted); font-weight: 600; font-size: .9rem; }
details.giornata .gruppo { margin-top: 6px; }
.link-tutto { font-weight: 800; text-decoration: none; padding: 10px 0; align-self: start; }
.record { font-weight: 700; margin: 0; }

/* ---------- Classifica ---------- */
.tabella-box { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card); border: 2px solid var(--linea); border-radius: 16px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: center; }
th { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--linea); }
td { border-bottom: 1px solid var(--linea); }
tr:last-child td { border-bottom: 0; }
td.squadra, th.squadra { text-align: left; }
td.squadra { font-weight: 800; }
td.squadra span { display: inline-flex; align-items: center; gap: 8px; }
td.squadra img { width: 24px; height: 24px; object-fit: contain; flex: none; }
td.pt { font-family: var(--f-display); font-size: 1.05rem; }
td.pos { font: 700 1.05rem var(--f-numeri); border-left: 5px solid var(--z, transparent); }
tr.mia td { background: var(--cuore-bg); }
.zone { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .9rem; color: var(--muted); }
.zone span::before { content: ""; display: inline-block; width: 5px; height: 14px; margin-right: 6px; vertical-align: -2px; background: var(--c); }
.nota { margin: 0; font-size: .85rem; color: var(--muted); }

/* ---------- Esultanze ---------- */
.esultanze { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.es { background: var(--card); border: 2px solid var(--linea); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; scroll-margin: 80px 0 calc(var(--tab-h) + 24px); }
.es.flash { animation: flash 1.4s ease 2; }
@keyframes flash { 50% { border-color: var(--giallo); box-shadow: 0 0 0 6px rgba(255,207,26,.45); } }
.es figure { margin: 0; position: relative; background: var(--tabellone); }
.es figure img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 20%; display: block; }
.es figure figcaption { position: absolute; left: 10px; bottom: 10px; background: var(--giallo); color: #13201a; font: 400 .95rem var(--f-display); padding: 4px 10px; border-radius: 8px; max-width: calc(100% - 20px); }
.es .corpo { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.es figure video { width: 100%; height: auto; aspect-ratio: 1 / 1; display: block; object-fit: cover; background: #0b1830; }
.es figure .play { position: absolute; inset: 0; margin: auto; width: 76px; height: 76px; border-radius: 50%; border: 4px solid #13201a; background: var(--giallo); display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.es figure .play svg { width: 30px; height: 30px; margin-left: 5px; }
.es figure.va .play { display: none; }
.es .chi { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.es .chi .persona { display: flex; align-items: center; gap: 10px; min-width: 0; }
.es .chi .avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; border: 3px solid var(--giallo); flex: none; }
.es .chi b { font-weight: 800; font-size: 1.1rem; }
.es .chi span { color: var(--muted); font-size: .85rem; font-weight: 600; }
.es p { margin: 0; }
.es ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: passo; }
.es li { counter-increment: passo; display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; transition: background .2s, transform .2s; }
.es li::before { content: counter(passo); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--erba); color: #fff; font: 400 .85rem var(--f-display); }
.es li.attivo { background: var(--giallo); color: #13201a; transform: scale(1.03); font-weight: 800; }
.es .bottoni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.btn { font: 800 .95rem var(--f-testo); border: 2px solid var(--erba); background: var(--erba); color: #fff; padding: 10px 16px; min-height: 44px; border-radius: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; -webkit-appearance: none; appearance: none; }
.btn.chiaro { background: transparent; color: var(--link); border-color: var(--linea); }
.btn:active { transform: scale(.97); }
@media (hover: hover) { .btn:hover { filter: brightness(1.1); } }
.credito { font-size: .72rem; color: var(--muted); overflow-wrap: anywhere; }
.credito a { color: inherit; }
.sorpresa { background: var(--tabellone); color: #e8f2ea; border-radius: 18px; padding: 18px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.sorpresa p { margin: 0; max-width: 60ch; }
.sorpresa .btn { background: var(--giallo); border-color: var(--giallo); color: #13201a; font-size: 1.05rem; }

footer { border-top: 2px solid var(--linea); }
footer .wrap { padding-block: 20px 32px; color: var(--muted); font-size: .85rem; display: flex; flex-direction: column; gap: 4px; }
footer p { margin: 0; }

/* ---------- Telefono (iPhone e Android) ---------- */
@media (max-width: 700px) {
  html { scroll-padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
  body { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
  .campo .wrap { padding-block: 18px 16px; gap: 14px; }
  .logo { gap: 12px; }
  .logo svg { width: 46px; height: 46px; }
  .sotto { font-size: .9rem; }
  .cuore { width: 100%; }
  .cuore select { width: 100%; min-width: 0; }

  /* Tab bar in basso, come le app dell'iPhone */
  .tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; background: var(--barra); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); border-top: 1px solid rgba(255,255,255,.08); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; }
  .tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; padding-block: 4px 2px; overflow: visible; }
  .tabs a { flex-direction: column; justify-content: center; gap: 2px; min-height: 52px; padding: 4px 1px; font: 700 .66rem/1.1 var(--f-testo); letter-spacing: 0; color: var(--barra-testo); border-radius: 12px; text-align: center; }
  .tabs a svg { display: block; width: 26px; height: 26px; }
  .tabs a .lungo { display: none; }
  .tabs a .corto { display: inline; }
  .tabs a[aria-current="page"] { background: transparent; color: var(--led); }
  .tabs a:active { background: rgba(255,255,255,.06); }

  main .wrap { padding-block: 22px 32px; gap: 28px; }
  .griglia { gap: 12px; }
  .partita { padding: 12px; }
  .sq img { width: 40px; height: 40px; }
  .punteggio { font-size: 1.45rem; min-width: 80px; padding: 6px 10px; }
  .fatto { padding: 12px 14px; }
  .fatto b { font-size: 1.35rem; }
  .fatto span { font-size: .85rem; }
  .fatti.tre { gap: 8px; }
  .fatti.tre .fatto { padding: 10px 10px; }
  .fatti.tre .fatto b { font-size: 1.15rem; }
  .fatti.tre .fatto span { font-size: .78rem; line-height: 1.3; }
  .tua { padding: 14px; gap: 12px 20px; }
  .tua > img { width: 52px; height: 52px; }
  .filtri, .filtri label, .filtri select { width: 100%; }
  .sorpresa .btn { width: 100%; }
  .es .bottoni .btn { flex: 1; }
}
@media (max-width: 560px) {
  table { min-width: 0; }
  th.x, td.x { display: none; }
  th, td { padding: 9px 6px; }
  td.squadra img { width: 22px; height: 22px; }

  .forma i { width: 19px; height: 19px; font-size: .72rem; border-radius: 5px; }

}

  .tabs a { font-size: .6rem; }
  .compatta img { display: none; }
}

  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

<script>
const DATI = /*__DATI__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const giorno = (d, opz = { weekday: "short", day: "numeric", month: "short" }) => new Date(d + "T12:00:00").toLocaleDateString("it-IT", opz);
const stemma = (sq, lato = 44) => DATI.stemmi[sq] ? `<img src="${DATI.stemmi[sq]}" width="${lato}" height="${lato}" alt="" decoding="async">` : "";
const leggi = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const salva = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const riduciMovimento = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let cuore = leggi("squadra-cuore");

if (!DATI) {
  $("#vista").innerHTML = "<section><h2>Mancano i dati</h2><p>Esegui <code>python aggiorna_sito.py</code> e poi apri <code>index.html</code>.</p></section>";
  throw new Error("nessun dato");
}

// Orari in ora italiana (gestisce da solo l'ora legale)
const fmtOra = new Intl.DateTimeFormat("it-IT", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" });
DATI.partite.forEach(p => { if (p.ts) p.ora = fmtOra.format(new Date(p.ts)); });
const OGGI = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Rome" }); // AAAA-MM-GG
const giorniTra = d => Math.round((new Date(d + "T12:00:00") - new Date(OGGI + "T12:00:00")) / 86400000);

const giocate = DATI.partite.filter(p => p.gc !== null).sort((a, b) => (b.data + b.ora).localeCompare(a.data + a.ora));
const squadre = Object.keys(DATI.stemmi).sort((a, b) => a.localeCompare(b, "it"));
const stagioneOra = DATI.stagione;

// Sottotitolo e squadra del cuore
const [aa, mm] = DATI.aggiornato.split(" ");
$("#sottotitolo").textContent = `Serie A ${stagioneOra.replace("-20", "/")} · aggiornato ${giorno(aa, { day: "numeric", month: "long" })}`;
$("#agg").textContent = `Dati aggiornati il ${giorno(aa, { day: "numeric", month: "long", year: "numeric" })} alle ${mm}.`;
const sel = $("#scelta-cuore");
sel.insertAdjacentHTML("beforeend", squadre.map(s => `<option ${s === cuore ? "selected" : ""}>${esc(s)}</option>`).join(""));
sel.addEventListener("change", () => { cuore = sel.value; salva("squadra-cuore", cuore); mostra(); });

const esito = (p, sq) => {
  const mie = p.casa === sq ? p.gc : p.go, loro = p.casa === sq ? p.go : p.gc;
  return mie > loro ? "V" : mie < loro ? "P" : "N";
};
const forma = (sq, n = 5) => giocate.filter(p => p.stagione === stagioneOra && (p.casa === sq || p.ospiti === sq)).slice(0, n).reverse().map(p => esito(p, sq));
const pallini = arr => `<span class="forma" aria-label="Ultime partite: ${arr.join(" ")}">${arr.map(e => `<i class="${e}" title="${{ V: "Vinta", N: "Pareggiata", P: "Persa" }[e]}">${e}</i>`).join("")}</span>`;

function cartaPartita(p) {
  const fatta = p.gc !== null;
  const cl = (a, b) => !fatta || a === b ? "" : a > b ? "vince" : "perde";
  const mia = cuore && (p.casa === cuore || p.ospiti === cuore);
  const centro = fatta ? `<div class="punteggio" aria-label="${p.gc} a ${p.go}">${p.gc}-${p.go}</div>`
    : `<div class="punteggio ora">${p.rinviata ? "Rinviata" : esc(p.ora || "–")}</div>`;
  return `<article class="partita ${mia ? "mia" : ""}">
    <div class="riga">
      <div class="sq ${cl(p.gc, p.go)}">${stemma(p.casa)}${esc(p.casa)}</div>
      ${centro}
      <div class="sq ${cl(p.go, p.gc)}">${stemma(p.ospiti)}${esc(p.ospiti)}</div>
    </div>
    <div class="info"><span>${giorno(p.data)} · ${esc(p.stadio)}</span>${p.video ? `<a href="${esc(p.video)}" target="_blank" rel="noopener">▶ Gol e azioni</a>` : ""}</div>
  </article>`;
}

function boxTuaSquadra() {
  if (!cuore) return "";
  const riga = DATI.classifica.find(r => r.squadra === cuore);
  const ultima = giocate.find(p => p.casa === cuore || p.ospiti === cuore);
  const prossima = DATI.partite.filter(p => p.gc === null && !p.rinviata && (p.casa === cuore || p.ospiti === cuore)).sort((a, b) => a.data.localeCompare(b.data))[0];
  return `<section class="tua" aria-label="La tua squadra">
    ${stemma(cuore, 64)}
    <div><div class="etichetta">La tua squadra</div><div class="nome">${esc(cuore)}</div></div>
    <dl>
      ${riga ? `<div><dt>Posizione</dt><dd>${riga.pos}ª con ${riga.punti} punti</dd></div>` : ""}
      ${ultima ? `<div><dt>Ultima partita</dt><dd>${esc(ultima.casa)} ${ultima.gc}-${ultima.go} ${esc(ultima.ospiti)}</dd></div>` : ""}
      ${prossima ? `<div><dt>Prossima</dt><dd>${esc(prossima.casa === cuore ? prossima.ospiti : prossima.casa)} · ${giorno(prossima.data)}</dd></div>` : ""}
      <div><dt>Ultime 5</dt><dd>${pallini(forma(cuore))}</dd></div>
    </dl>
  </section>`;
}

// ---------- Vista: ultima giornata ----------
function vistaGiornata() {
  const ultimaG = giocate.find(p => p.stagione === stagioneOra)?.giornata;
  const diQuesta = DATI.partite.filter(p => p.stagione === stagioneOra && p.giornata === ultimaG).sort((a, b) => (a.data + a.ora).localeCompare(b.data + b.ora));
  const fatte = diQuesta.filter(p => p.gc !== null);
  const prossime = DATI.partite.filter(p => p.gc === null && !p.rinviata).sort((a, b) => (a.data + a.ora).localeCompare(b.data + b.ora));
  const gol = fatte.reduce((s, p) => s + p.gc + p.go, 0);
  const piuGol = [...fatte].sort((a, b) => (b.gc + b.go) - (a.gc + a.go))[0];
  const larga = [...fatte].sort((a, b) => Math.abs(b.gc - b.go) - Math.abs(a.gc - a.go))[0];
  const pari = fatte.filter(p => p.gc === p.go).length;
  const giornataProssima = prossime[0]?.giornata;
  return `
    ${boxTuaSquadra()}
    <section>
      <div class="intesta"><h2>Giornata ${ultimaG}</h2><p>${fatte.length ? `dal ${giorno(fatte[0].data, { day: "numeric", month: "long" })} al ${giorno(fatte.at(-1).data, { day: "numeric", month: "long" })}` : ""}</p></div>
      <div class="fatti">
        <div class="fatto"><b>${gol}</b><span>gol segnati in ${fatte.length} partite</span></div>
        ${piuGol ? `<div class="fatto"><b>${piuGol.gc + piuGol.go} gol</b><span>la partita più pazza: ${esc(piuGol.casa)}-${esc(piuGol.ospiti)} ${piuGol.gc}-${piuGol.go}</span></div>` : ""}
        ${larga ? `<div class="fatto"><b>+${Math.abs(larga.gc - larga.go)}</b><span>la vittoria più larga: ${esc(larga.gc > larga.go ? larga.casa : larga.ospiti)} (${larga.gc}-${larga.go})</span></div>` : ""}
        <div class="fatto"><b>${pari}</b><span>${pari === 1 ? "pareggio" : "pareggi"}</span></div>
      </div>
      <div class="griglia">${diQuesta.map(cartaPartita).join("")}</div>
    </section>
    ${prossime.length ? `<section>
      <div class="intesta"><h2>Prossime partite</h2><p>Giornata ${giornataProssima} · orari italiani</p></div>
      <div class="griglia">${prossime.filter(p => p.giornata === giornataProssima).map(cartaPartita).join("")}</div>
      <a class="link-tutto" href="#calendario">Tutte le partite da giocare →</a>
    </section>` : ""}`;
}

// ---------- Vista: prossime partite (calendario) ----------
let filtroCal = "";
function rigaFutura(p) {
  const mia = cuore && (p.casa === cuore || p.ospiti === cuore);
  return `<div class="compatta fut ${mia ? "mia" : ""}">
    <span class="c"><span class="nome-lungo">${esc(p.casa)}</span>${stemma(p.casa, 24)}</span>
    <span class="s"><b>${giorno(p.data, { weekday: "short", day: "numeric", month: "short" })}</b>${p.rinviata ? "rinviata" : esc(p.ora || "ora da decidere")}</span>
    <span class="o">${stemma(p.ospiti, 24)}<span class="nome-lungo">${esc(p.ospiti)}</span></span>
  </div>`;
}
function vistaCalendario() {
  const future = DATI.partite.filter(p => p.gc === null && p.data >= OGGI).sort((a, b) => (a.data + a.ora).localeCompare(b.data + b.ora));
  const rinviate = DATI.partite.filter(p => p.gc === null && p.data < OGGI);
  const lista = filtroCal ? future.filter(p => p.casa === filtroCal || p.ospiti === filtroCal) : future;
  const gruppi = new Map();
  lista.forEach(p => { if (!gruppi.has(p.giornata)) gruppi.set(p.giornata, []); gruppi.get(p.giornata).push(p); });
  const numGiornate = new Set(future.map(p => p.giornata)).size;
  const ultima = future.at(-1);

  let conto = "";
  const chi = filtroCal || cuore;
  const prossima = chi && future.find(p => p.casa === chi || p.ospiti === chi);
  if (prossima) {
    const g = giorniTra(prossima.data);
    const quando = g <= 0 ? "oggi!" : g === 1 ? "domani!" : `tra ${g} giorni`;
    conto = `<div class="conto">${stemma(chi, 48)}
      <div><div class="etichetta">Prossima partita ${chi === cuore ? "della tua squadra" : "di " + esc(chi)}</div>
      <div class="grande">${quando}</div>
      <p>${esc(prossima.casa)} - ${esc(prossima.ospiti)} · ${giorno(prossima.data, { weekday: "long", day: "numeric", month: "long" })}${prossima.ora ? ` alle ${esc(prossima.ora)}` : ""}</p></div></div>`;
  }

  const blocchi = [...gruppi.entries()].map(([g, ps], i) => {
    const dal = giorno(ps[0].data, { day: "numeric", month: "short" }), al = giorno(ps.at(-1).data, { day: "numeric", month: "short" });
    return `<details class="giornata" ${filtroCal || i < 2 ? "open" : ""}>
      <summary>Giornata ${g} <span>${dal === al ? dal : `${dal} – ${al}`}</span></summary>
      <div class="gruppo">${ps.map(rigaFutura).join("")}</div>
    </details>`;
  }).join("");

  return `<section>
    <div class="intesta"><h2>Prossime partite</h2><p>orari italiani</p></div>
    ${conto}
    <div class="filtri"><label for="filtro-cal">Mostra solo
      <select id="filtro-cal"><option value="">Tutte le squadre</option>${squadre.map(s => `<option ${s === filtroCal ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
    </div>
    <div class="fatti tre">
      <div class="fatto"><b>${lista.length}</b><span>partite da giocare${filtroCal ? ` per ${esc(filtroCal)}` : ""}</span></div>
      <div class="fatto"><b>${numGiornate}</b><span>giornate alla fine</span></div>
      ${ultima ? `<div class="fatto"><b>${giorno(ultima.data, { day: "numeric", month: "short" })}</b><span>l'ultima giornata (${new Date(ultima.data).getFullYear()})</span></div>` : ""}
    </div>
    ${rinviate.length ? `<p class="nota">Partite rinviate da recuperare: ${rinviate.map(p => `${esc(p.casa)}-${esc(p.ospiti)}`).join(", ")}.</p>` : ""}
    <div class="elenco">${blocchi || "<p>Il campionato è finito!</p>"}</div>
    <p class="nota">Le giornate più lontane hanno orari provvisori: la Lega li decide qualche settimana prima.</p>
  </section>`;
}

// ---------- Vista: ultime 100 ----------
let filtro = "";
function vistaCento() {
  const cento = giocate.slice(0, 100);
  const lista = filtro ? cento.filter(p => p.casa === filtro || p.ospiti === filtro) : cento;
  const n = lista.length || 1;
  const gol = lista.reduce((s, p) => s + p.gc + p.go, 0);
  let casa = 0, pari = 0, fuori = 0;
  lista.forEach(p => p.gc > p.go ? casa++ : p.gc < p.go ? fuori++ : pari++);
  const perc = x => Math.round(x / n * 100);

  const perG = new Map();
  [...cento].reverse().forEach(p => { const k = `${p.stagione}|${p.giornata}`; perG.set(k, (perG.get(k) || 0) + p.gc + p.go); });
  const maxG = Math.max(...perG.values());
  const barre = [...perG.entries()].map(([k, v]) => `<div class="b" title="Giornata ${k.split("|")[1]}: ${v} gol"><span>${v}</span><div style="height:${v / maxG * 82}%"></div></div>`).join("");
  const asse = [...perG.keys()].map(k => `<span>G${k.split("|")[1]}</span>`).join("");

  let record = "";
  if (filtro) {
    let v = 0, nn = 0, pp = 0, gf = 0, gs = 0;
    lista.forEach(p => { const e = esito(p, filtro); e === "V" ? v++ : e === "N" ? nn++ : pp++; gf += p.casa === filtro ? p.gc : p.go; gs += p.casa === filtro ? p.go : p.gc; });
    record = `<p class="record">${esc(filtro)}: ${v} vinte, ${nn} pareggiate, ${pp} perse · ${gf} gol fatti, ${gs} subiti</p>`;
  }

  const gruppi = new Map();
  lista.forEach(p => { const k = `${p.stagione}|${p.giornata}`; if (!gruppi.has(k)) gruppi.set(k, []); gruppi.get(k).push(p); });
  const righe = [...gruppi.entries()].map(([k, ps]) => {
    const [st, g] = k.split("|");
    return `<div class="gruppo"><div class="etichetta">Giornata ${g}${st !== stagioneOra ? ` · stagione ${st}` : ""}</div>
      ${ps.map(p => {
        const mia = cuore && (p.casa === cuore || p.ospiti === cuore);
        return `<div class="compatta ${mia ? "mia" : ""}">
          <span class="d">${giorno(p.data, { day: "numeric", month: "short" })}</span>
          <span class="c ${p.gc < p.go ? "perde" : ""}"><span class="nome-lungo">${esc(p.casa)}</span>${stemma(p.casa, 24)}</span>
          <span class="s">${p.gc}-${p.go}</span>
          <span class="o ${p.go < p.gc ? "perde" : ""}">${stemma(p.ospiti, 24)}<span class="nome-lungo">${esc(p.ospiti)}</span></span>
          ${p.video ? `<a class="v" href="${esc(p.video)}" target="_blank" rel="noopener" aria-label="Guarda gol e azioni di ${esc(p.casa)}-${esc(p.ospiti)}">▶</a>` : "<span></span>"}
        </div>`;
      }).join("")}</div>`;
  }).join("");

  return `
    <section>
      <div class="intesta"><h2>Le ultime 100 partite</h2><p>dalla più recente alla più vecchia</p></div>
      <div class="filtri"><label for="filtro-squadra">Mostra solo
        <select id="filtro-squadra"><option value="">Tutte le squadre</option>${squadre.map(s => `<option ${s === filtro ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
      </div>
      ${record}
      <div class="fatti tre">
        <div class="fatto"><b>${lista.length}</b><span>partite</span></div>
        <div class="fatto"><b>${gol}</b><span>gol in tutto</span></div>
        <div class="fatto"><b>${(gol / n).toFixed(1).replace(".", ",")}</b><span>gol a partita, in media</span></div>
      </div>
      <div>
        <div class="barra-esiti" role="img" aria-label="Vince la squadra di casa ${perc(casa)}%, pareggio ${perc(pari)}%, vince la squadra ospite ${perc(fuori)}%">
          <div style="flex:${casa};background:var(--vinta)">${perc(casa)}%</div>
          <div style="flex:${pari};background:var(--pari)">${perc(pari)}%</div>
          <div style="flex:${fuori};background:var(--rosso)">${perc(fuori)}%</div>
        </div>
        <div class="legenda">
          <span style="--c:var(--vinta)">vince chi gioca in casa (${casa})</span>
          <span style="--c:var(--pari)">pareggio (${pari})</span>
          <span style="--c:var(--rosso)">vince la squadra ospite (${fuori})</span>
        </div>
      </div>
      ${filtro ? "" : `<div class="grafico"><h3>Gol per giornata</h3><div class="barre">${barre}</div><div class="assex">${asse}</div></div>`}
      <div class="elenco">${righe}</div>
    </section>`;
}

// ---------- Vista: classifica ----------
function zona(z) {
  if (/champions/i.test(z)) return "var(--erba)";
  if (/conference/i.test(z)) return "#5fb3d9";
  if (/europa/i.test(z)) return "#e58b20";
  if (/releg|retroc/i.test(z)) return "var(--rosso)";
  return "transparent";
}
function vistaClassifica() {
  const zoneViste = [...new Map(DATI.classifica.filter(r => zona(r.zona) !== "transparent").map(r => [r.zona, zona(r.zona)])).entries()];
  const nomiZone = z => /champions/i.test(z) ? "Champions League" : /conference/i.test(z) ? "Conference League" : /europa/i.test(z) ? "Europa League" : /releg|retroc/i.test(z) ? "Retrocessione in Serie B" : z;
  return `<section>
    <div class="intesta"><h2>Classifica</h2><p>Serie A ${stagioneOra.replace("-20", "/")}</p></div>
    <div class="tabella-box"><table>
      <thead><tr><th>#</th><th class="squadra">Squadra</th><th title="Punti">Pt</th><th title="Giocate">G</th><th class="x" title="Vinte">V</th><th class="x" title="Pareggiate">N</th><th class="x" title="Perse">P</th><th class="x" title="Gol fatti">GF</th><th class="x" title="Gol subiti">GS</th><th class="x" title="Differenza reti">DR</th><th>Ultime 5</th></tr></thead>
      <tbody>${DATI.classifica.map(r => `<tr class="${r.squadra === cuore ? "mia" : ""}">
        <td class="pos" style="--z:${zona(r.zona)}">${r.pos}</td>
        <td class="squadra"><span>${stemma(r.squadra, 24)}${esc(r.squadra)}</span></td>
        <td class="pt">${r.punti}</td><td>${r.g}</td><td class="x">${r.v}</td><td class="x">${r.n}</td><td class="x">${r.p}</td><td class="x">${r.gf}</td><td class="x">${r.gs}</td><td class="x">${r.dr > 0 ? "+" : ""}${r.dr}</td>
        <td>${pallini(forma(r.squadra))}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="zone">${zoneViste.map(([z, c]) => `<span style="--c:${c}">${esc(nomiZone(z))}</span>`).join("")}</div>
    <p class="nota">Ultime 5: la più vecchia a sinistra, la più recente a destra. V vinta, N pareggiata, P persa.</p>
    <p class="nota">Classifica calcolata dai risultati. A pari punti qui conta la differenza reti (nel regolamento vero contano prima gli scontri diretti).</p>
  </section>`;
}

// ---------- Vista: esultanze ----------
function vistaEsultanze() {
  return `<section>
    <div class="intesta"><h2>Le esultanze più famose</h2><p>${DATI.esultanze.length} mosse da imparare</p></div>
    <div class="sorpresa">
      <p>Hai segnato in cortile? Premi il bottone e scopri quale esultanza fare. Poi premi «Prova la mossa» e segui i passi!</p>
      <button class="btn" id="sorpresa" type="button">Esultanza a sorpresa</button>
    </div>
    <div class="esultanze">${DATI.esultanze.map((e, i) => `
      <article class="es" id="es-${i}">
        ${e.video ? `<figure class="anim">
          <video src="${e.video}" ${e.poster ? `poster="${e.poster}"` : ""} width="720" height="720" muted loop playsinline preload="none" aria-label="Animazione: ${esc(e.mossa)}"></video>
          <button class="play" type="button" aria-label="Guarda l'animazione di ${esc(e.mossa)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l15 9-15 9z" fill="#13201a"/></svg></button>
        </figure>` : `<figure>
          ${e.foto ? `<img src="${e.foto}" alt="${esc(e.giocatore)}" width="640" height="480" loading="${i < 2 ? "eager" : "lazy"}" decoding="async">` : ""}
          <figcaption>${esc(e.mossa)}</figcaption>
        </figure>`}
        <div class="corpo">
          <div class="chi"><span class="persona">${e.video && e.foto ? `<img class="avatar" src="${e.foto}" alt="" width="46" height="46" loading="lazy" decoding="async">` : ""}<b>${esc(e.giocatore)}</b></span><span>${esc(e.paese)}</span></div>
          <p>${esc(e.storia)}</p>
          <div class="etichetta">Come si fa</div>
          <ol>${e.passi.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
          <div class="bottoni">
            <button class="btn prova" type="button" data-i="${i}">Prova la mossa</button>
            <a class="btn chiaro" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.video)}" target="_blank" rel="noopener">▶ Guarda i video</a>
          </div>
          ${e.credito ? `<div class="credito">Foto: ${esc(e.credito.autore)}${e.credito.licenza ? `, ${esc(e.credito.licenza)}` : ""} · <a href="${esc(e.credito.pagina)}" target="_blank" rel="noopener">Wikimedia Commons</a></div>` : ""}
        </div>
      </article>`).join("")}
    </div>
  </section>`;
}

let timerProva = null;
function prova(i) {
  clearInterval(timerProva);
  document.querySelectorAll(".es li.attivo").forEach(li => li.classList.remove("attivo"));
  const passi = [...document.querySelectorAll(`#es-${i} li`)];
  let k = 0;
  const vai = () => {
    passi.forEach((li, j) => li.classList.toggle("attivo", j === k));
    if (k++ >= passi.length) { clearInterval(timerProva); passi.forEach(li => li.classList.remove("attivo")); }
  };
  vai();
  timerProva = setInterval(vai, 1300);
}

// ---------- Video delle esultanze: partono da soli quando si vedono ----------
let osservatore = null;
const suona = v => { const p = v.play(); if (p) p.then(() => v.closest("figure").classList.add("va")).catch(() => v.closest("figure").classList.remove("va")); };
const ferma = v => { v.pause(); v.closest("figure").classList.remove("va"); };
function avviaVideo() {
  if (osservatore) osservatore.disconnect();
  const video = document.querySelectorAll(".es video");
  if (!video.length || !("IntersectionObserver" in window)) return;
  if (riduciMovimento()) return; // chi preferisce meno movimento li avvia col bottone
  osservatore = new IntersectionObserver(voci => voci.forEach(v => v.isIntersecting ? suona(v.target) : ferma(v.target)), { threshold: 0.6 });
  video.forEach(v => osservatore.observe(v));
}

document.addEventListener("click", ev => {
  const fig = ev.target.closest("figure.anim");
  if (fig) { const v = fig.querySelector("video"); v.paused ? suona(v) : ferma(v); }
  const b = ev.target.closest(".prova");
  if (b) {
    prova(b.dataset.i);
    const v = document.querySelector(`#es-${b.dataset.i} video`);
    if (v) { v.currentTime = 0; suona(v); }
  }
  if (ev.target.closest("#sorpresa")) {
    const i = Math.floor(Math.random() * DATI.esultanze.length);
    const card = $(`#es-${i}`);
    card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
    card.scrollIntoView({ behavior: riduciMovimento() ? "auto" : "smooth", block: "start" });
    setTimeout(() => prova(i), 700);
  }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "filtro-squadra") { filtro = ev.target.value; mostra(); }
  if (ev.target.id === "filtro-cal") { filtroCal = ev.target.value; mostra(); }
});

// ---------- Navigazione ----------
const VISTE = { "giornata": vistaGiornata, "calendario": vistaCalendario, "ultime-100": vistaCento, "classifica": vistaClassifica, "esultanze": vistaEsultanze };
function mostra() {
  const nomeVista = VISTE[location.hash.slice(1)] ? location.hash.slice(1) : "giornata";
  document.querySelectorAll(".tabs a").forEach(a => {
    if (a.getAttribute("href") === "#" + nomeVista) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  $("#vista").innerHTML = VISTE[nomeVista]();
  avviaVideo();
}
// Toccare di nuovo la sezione già aperta riporta in cima, come nelle app dell'iPhone
document.querySelector(".tabs").addEventListener("click", ev => {
  const a = ev.target.closest("a");
  if (a && a.getAttribute("aria-current") === "page") { ev.preventDefault(); scrollTo({ top: 0, behavior: riduciMovimento() ? "auto" : "smooth" }); }
});
addEventListener("hashchange", () => { mostra(); scrollTo({ top: 0 }); });
mostra();
</script>
