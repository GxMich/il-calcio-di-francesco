    <script>
      // ---------- Dati della mossa scelta ----------
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const MOSSA = vars.mossa || "siuuu";
      const TITOLI = {
        "siuuu": "Il «Siuuu!»", "braccia-incrociate": "Braccia incrociate", "meditazione": "La meditazione",
        "dita-al-cielo": "Dita al cielo", "maschera": "La maschera", "braccia-spalancate": "Braccia spalancate",
        "balletto-l": "Il balletto della L", "selfie": "Il selfie", "linguaccia": "La linguaccia", "urlo": "L'urlo",
        "bambino": "Il bambino in braccio", "dab": "Il dab", "bandierina": "Il ballo della bandierina", "robot": "Il robot",
      };
      document.getElementById("titolo-testo").textContent = TITOLI[MOSSA] || TITOLI.siuuu;

      // ---------- Numeri casuali ripetibili (stesso video a ogni render) ----------
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(MOSSA.length * 7919 + MOSSA.charCodeAt(0));

      // ---------- Icone per gli effetti ----------
      const ICONE = {
        cuore: '<svg viewBox="0 0 64 64"><path d="M32 56 C10 40 4 28 8 18 C12 8 26 6 32 18 C38 6 52 8 56 18 C60 28 54 40 32 56Z" fill="#ff5a7a" stroke="#13201a" stroke-width="4"/></svg>',
        stella: '<svg viewBox="0 0 64 64"><path d="M32 4 L40 24 L61 25 L44 38 L50 59 L32 47 L14 59 L20 38 L3 25 L24 24Z" fill="#ffcf1a" stroke="#13201a" stroke-width="4" stroke-linejoin="round"/></svg>',
        nota: '<svg viewBox="0 0 64 64"><path d="M24 46 V12 L54 6 V40" fill="none" stroke="#13201a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="47" r="9" fill="#fff" stroke="#13201a" stroke-width="4"/><circle cx="47" cy="41" r="9" fill="#fff" stroke="#13201a" stroke-width="4"/></svg>',
      };
      function iconeFx(tipo) { document.querySelectorAll(".fx").forEach(el => { el.innerHTML = ICONE[tipo]; el.querySelector("svg").style.display = "block"; }); }

      // ---------- Rig ----------
      const tl = gsap.timeline({ paused: true });
      const PARTI = ["lTh", "lSh", "rTh", "rSh", "lUA", "lFA", "rUA", "rFA", "testa", "torso"];
      gsap.set(PARTI.map(p => "#" + p), { transformOrigin: "50% 0%" });
      gsap.set(["#testa", "#torso"], { transformOrigin: "0px 0px" });
      gsap.set("#pl", { transformOrigin: "0px 240px" });
      gsap.set("#ombra", { transformOrigin: "50% 50%" });
      gsap.set("#bebe", { transformOrigin: "50% 50%" });

      const SPALLA = { l: [-66, -200], r: [66, -200] };
      const L1 = 94, L2 = 105;
      const deg = r => r * 180 / Math.PI;
      // Cinematica inversa: dove deve arrivare la mano -> angoli di braccio e avambraccio
      function ik(lato, tx, ty, verso) {
        const [sx, sy] = SPALLA[lato];
        const dx = tx - sx, dy = ty - sy;
        const d = Math.min(Math.hypot(dx, dy), L1 + L2 - 1);
        const base = Math.atan2(-dx, dy);
        const a = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
        const interno = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2))));
        return [deg(base + verso * a), deg(-verso * (Math.PI - interno))];
      }
      // verso: +1 gomito verso l'esterno per il braccio sinistro, -1 per il destro (default)
      function posa(t, dur, p, ease = "power2.inOut") {
        const out = {};
        if (p.l) { const [u, f] = ik("l", p.l[0], p.l[1], p.l[2] ?? -1); out.lUA = { rotation: u }; out.lFA = { rotation: f }; }
        if (p.r) { const [u, f] = ik("r", p.r[0], p.r[1], p.r[2] ?? 1); out.rUA = { rotation: u }; out.rFA = { rotation: f }; }
        for (const k of ["lTh", "lSh", "rTh", "rSh", "testa", "torso"]) if (p[k] !== undefined) out[k] = { rotation: p[k] };
        if (p.pl) out.pl = p.pl;
        for (const [id, v] of Object.entries(out)) tl.to("#" + id, { ...v, duration: dur, ease }, t);
        if (p.pl && (p.pl.y !== undefined)) {
          const alto = Math.max(0, -p.pl.y);
          tl.to("#ombra", { scale: 1 - alto / 400, opacity: 1 - alto / 350, duration: dur, ease }, t);
        }
      }
      const RIPOSO = { l: [-96, 0], r: [96, 0], lTh: 4, lSh: 0, rTh: -4, rSh: 0, testa: 0, torso: 0, pl: { x: 0, y: 0, rotation: 0, scaleX: 1, scaleY: 1 } };
      // posizione iniziale
      posa(0, 0, RIPOSO);
      tl.set("#ombra", { scale: 1, opacity: 1 }, 0);

      const STATI = ["e-aperti", "e-chiusi", "e-felici", "e-ciglia", "m-sorriso", "m-aperta", "m-urlo", "m-lingua", "m-seria"];
      function faccia(t, ...accesi) { STATI.forEach(s => tl.set("#" + s, { opacity: accesi.includes(s) ? 1 : 0 }, t)); }
      faccia(0, "e-aperti", "m-sorriso");

      function fumetto(t, testo, dur = 2.6, colore = "#fff") {
